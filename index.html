        <!-- Section: ID Murid -->

            <h2 class="text-xl font-bold text-blue-900 mb-4 border-b pb-2"><i class="fas fa-search mr-2"></i>Semakan ID Murid</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Pilih Tahun:</label>
                    <select id="select-tahun" onchange="muatMurid()" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-800">

                        <option value="1">Tahun 1</option>
                        <option value="2">Tahun 2</option>
                        <option value="3">Tahun 3</option>
                        <option value="4">Tahun 4</option>
                        <option value="5">Tahun 5</option>

                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Pilih Nama Murid:</label>
                    <select id="select-murid" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-800" disabled>
                        <option value="">-- Pilih Tahun Terlebih Dahulu --</option>
                    </select>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">4 Digit Terakhir No. Kad Pengenalan / MyKID:</label>
                <input type="password" id="ic-security" maxlength="4" placeholder="Contoh: 0495" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-800">
            </div>
            <button onclick="cariMurid()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition duration-200">
                Semak ID

            <div id="card-murid" class="mt-4"></div>
        </div>

        <!-- Section: ID Sekolah (CM, Makmal, Temp) -->

            <h2 class="text-xl font-bold text-blue-900 mb-4 border-b pb-2"><i class="fas fa-user-shield mr-2"></i>Semakan ID DELIMa Sekolah</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Pilih Kategori ID:</label>
                    <select id="select-kategori-sekolah" onchange="muatSubKategoriSekolah()" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-800">

                        <option value="admin">ID Content Manager (CM)</option>
                        <option value="makmal">ID Makmal</option>
                        <option value="temp">ID Temporary</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Pilih Peranan / Akaun:</label>
                    <select id="select-akaun-sekolah" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-800" disabled>
                        <option value="">-- Pilih Kategori Terlebih Dahulu --</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Kod Sekuriti:</label>
                <input type="password" id="sekolah-security" maxlength="4" placeholder="Masukkan 4 digit kod" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-800">
            </div>

            <button onclick="cariSekolah()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition duration-200">
                Semak ID Sekolah
            </button>

            <div id="card-sekolah" class="mt-4"></div>
        </div>

    </main>

        // ==========================================
        // LOGIK APLIKASI WEB
        // ==========================================

        window.onload = function() {
            switchTab('guru');
            populateGuruDropdown();
        };

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-blue-900', 'text-white');
                btn.classList.add('bg-white', 'text-blue-900');
            });

            document.getElementById(`section-${tabName}`).classList.remove('hidden');
            
            const activeBtn = document.getElementById(`btn-${tabName}`);
            activeBtn.classList.remove('bg-white', 'text-blue-900');
            activeBtn.classList.add('bg-blue-900', 'text-white');
        }

        // --- ID GURU ---
        function populateGuruDropdown() {
            const select = document.getElementById('select-guru');
            dataGuru.forEach(guru => {
                let opt = document.createElement('option');
                opt.value = guru.nama;
                opt.innerHTML = guru.nama;
                select.appendChild(opt);
            });
        }

        function cariGuru() {
            const nama = document.getElementById('select-guru').value;
            const container = document.getElementById('card-guru');
            
            if(!nama) {
                container.innerHTML = '';
                return;
            }

            const guru = dataGuru.find(g => g.nama === nama);
            if(guru) {
                container.innerHTML = createCardHTML(guru.nama, "Guru Sekolah", guru.email, null);
            }
        }

        // --- ID MURID ---
        function muatMurid() {
            const tahun = document.getElementById('select-tahun').value;
            const selectMurid = document.getElementById('select-murid');
            selectMurid.innerHTML = '<option value="">-- Pilih Nama Murid --</option>';

            if(!tahun) {
                selectMurid.disabled = true;
                return;
            }

            const muridFiltered = dataMurid.filter(m => m.tahun === tahun);
            muridFiltered.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m.nama;
                opt.innerHTML = m.nama;
                selectMurid.appendChild(opt);
            });

            selectMurid.disabled = false;
        }

        function cariMurid() {
            const nama = document.getElementById('select-murid').value;
            const icInput = document.getElementById('ic-security').value.trim();
            const container = document.getElementById('card-murid');

            if(!nama) {
                alert("Sila pilih nama murid terlebih dahulu.");
                return;
            }

            const murid = dataMurid.find(m => m.nama === nama);

            if(murid && murid.icLast4 === icInput) {
                container.innerHTML = createCardHTML(murid.nama, `Murid (Tahun ${murid.tahun})`, murid.email, murid.pass);
            } else {
                alert("4 Digit Terakhir No. Kad Pengenalan / MyKID Tidak Tepat!");
                container.innerHTML = '';
            }
        }

        // --- ID SEKOLAH (CM, MAKMAL, TEMP) ---
        function muatSubKategoriSekolah() {
            const kat = document.getElementById('select-kategori-sekolah').value;
            const selectAkaun = document.getElementById('select-akaun-sekolah');
            const cardContainer = document.getElementById('card-sekolah');
            
            selectAkaun.innerHTML = '<option value="">-- Pilih Peranan / Akaun --</option>';
            cardContainer.innerHTML = '';

            if(!kat) {
                selectAkaun.disabled = true;
                return;
            }

            if(kat === 'admin') {
                dataAdmin.forEach(a => {
                    let opt = document.createElement('option');
                    opt.value = a.label;
                    opt.innerHTML = a.label;
                    selectAkaun.appendChild(opt);
                });
            } else if(kat === 'makmal') {
                dataMakmal.forEach(m => {
                    let opt = document.createElement('option');
                    opt.value = m.nama;
                    opt.innerHTML = m.nama;
                    selectAkaun.appendChild(opt);
                });
            } else if(kat === 'temp') {
                dataTemp.forEach(t => {
                    let opt = document.createElement('option');
                    opt.value = t.nama;
                    opt.innerHTML = t.nama;
                    selectAkaun.appendChild(opt);
                });
            }

            selectAkaun.disabled = false;
        }

        function cariSekolah() {
            const kat = document.getElementById('select-kategori-sekolah').value;
            const val = document.getElementById('select-akaun-sekolah').value;
            const passCode = document.getElementById('sekolah-security').value.trim();
            const container = document.getElementById('card-sekolah');

            if(!kat || !val) {
                alert("Sila pilih kategori dan peranan / akaun terlebih dahulu.");
                return;
            }

            if(passCode !== '0000') {
                alert("Kod Sekuriti Salah! Masukkan kod 0000.");
                container.innerHTML = '';
                return;
            }

            if(kat === 'admin') {
                const item = dataAdmin.find(a => a.label === val);
                if(item) {
                    container.innerHTML = createCardHTML(item.label, `Peranan: ${item.peranan} (${item.nama})`, item.email, item.pass);
                }
            } else if(kat === 'makmal') {
                const item = dataMakmal.find(m => m.nama === val);
                if(item) {
                    container.innerHTML = createCardHTML(item.nama, "ID Makmal", item.email, item.pass);
                }
            } else if(kat === 'temp') {
                const item = dataTemp.find(t => t.nama === val);
                if(item) {
                    container.innerHTML = createCardHTML(item.nama, "ID Temporary", item.email, item.pass);
                }
            }
        }

        // Template Kad
        function createCardHTML(title, subtitle, email, password) {
            return `
                <div class="bg-blue-50 border-l-4 border-blue-900 p-4 rounded-r-lg shadow-sm">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-gray-800 text-lg">${title}</h4>
                            <span class="inline-block bg-blue-200 text-blue-900 text-xs px-2 py-0.5 rounded font-semibold mt-1">${subtitle}</span>
                        </div>
                        <i class="fas fa-id-card text-2xl text-blue-900"></i>
                    </div>
                    <div class="mt-3 text-sm text-gray-700 space-y-1">
                        <p><strong>Email:</strong> <span class="select-all text-blue-900 font-mono">${email}</span></p>
                        ${password ? `<p><strong>Password:</strong> <span class="select-all font-mono">${password}</span></p>` : ''}
                    </div>
                </div>
            `;
        }
